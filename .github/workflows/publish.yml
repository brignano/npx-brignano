# Publishes to npm when a GitHub release is created.
# https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish Package

on:
  workflow_dispatch:
  release:
    # `created` never fires for draft releases, and does not fire when a release
    # is published from a previously-saved draft — so the usual "save a draft,
    # write the notes, hit Publish" flow silently skipped the npm publish.
    # `published` covers both publishing directly and publishing from a draft.
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: lets the job mint an OIDC token so npm can
      # attest that this tarball was built from this repo, commit and workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Install & Build
        run: |
          npm ci
          npm run build
      - name: Lint
        run: npm run lint
      - name: Test (non-interactive)
        run: npm test
        env:
          CI: true
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `published` also fires for pre-releases, so ship those under the
        # `next` dist-tag — otherwise a pre-release would become the version
        # `npx brignano` resolves to. Manual runs publish to `latest`.
        run: npm publish ${{ github.event.release.prerelease && '--tag next' || '' }}
