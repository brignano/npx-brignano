# Publishes to npm when a GitHub release is created.
# https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish Package

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: lets the job mint an OIDC token so npm can
      # attest that this tarball was built from this repo, commit and workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Install & Build
        run: |
          npm ci
          npm run build
      - name: Lint
        run: npm run lint
      - name: Test (non-interactive)
        run: npm test
        env:
          CI: true
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
